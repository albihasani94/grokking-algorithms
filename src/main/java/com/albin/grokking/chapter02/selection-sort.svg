<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">Animated selection sort</title>
  <desc id="desc">Selection sort animation for the array 64, 25, 12, 22, 11, ending at 11, 12, 22, 25, 64.</desc>
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #1f2937; }
      .heading { font: 700 22px system-ui, sans-serif; }
      .sub { font: 14px system-ui, sans-serif; fill: #6b7280; }
      .value { font-size: 24px; font-weight: 700; }
      .index { font-size: 12px; fill: #6b7280; }
      .note { font: 600 14px system-ui, sans-serif; }
      .cell { fill: #ffffff; stroke: #9ca3af; stroke-width: 2; rx: 12; }
      .sorted { fill: #ecfdf5; stroke: #10b981; }
      .minimum { fill: #fff7ed; stroke: #f59e0b; stroke-width: 3; }
      .compare { fill: #eff6ff; stroke: #3b82f6; stroke-width: 3; }
      .legend { font: 13px system-ui, sans-serif; fill: #4b5563; }
      @media (prefers-color-scheme: dark) {
        text { fill: #f3f4f6; }
        .sub, .index, .legend { fill: #9ca3af; }
        .cell { fill: #111827; stroke: #6b7280; }
        .sorted { fill: #052e24; stroke: #34d399; }
        .minimum { fill: #451a03; stroke: #fbbf24; }
        .compare { fill: #172554; stroke: #60a5fa; }
      }
    </style>
  </defs>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.90;1" dur="1.500s" begin="0.000s" fill="freeze" repeatCount="1"/>
    <text x="380.0" y="42" text-anchor="middle" class="heading">Pass 1 — start</text>
    <text x="380.0" y="68" text-anchor="middle" class="sub">Search the whole array for the minimum</text>
    <rect x="118.0" y="138" width="92" height="72" class="cell minimum"/>
    <text x="164.0" y="182" text-anchor="middle" class="value">64</text>
    <text x="164.0" y="230" text-anchor="middle" class="index">index 0</text>
    <rect x="226.0" y="138" width="92" height="72" class="cell compare"/>
    <text x="272.0" y="182" text-anchor="middle" class="value">25</text>
    <text x="272.0" y="230" text-anchor="middle" class="index">index 1</text>
    <rect x="334.0" y="138" width="92" height="72" class="cell"/>
